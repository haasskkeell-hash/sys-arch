<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixtrack — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.32.0/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#16233B;--blue:#1E80F0;--blue-hover:#1670D8;--bg:#FAFAFA;--muted:#8A8F98;--border:#E4E4E7;--error:#E24B4A;--success:#1D9E75;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--navy);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
.auth-wrap{width:100%;max-width:400px;padding:24px}
.logo-wrap{display:flex;justify-content:center;margin-bottom:32px}
.logo-wrap img{width:40px;height:40px;display:block}
.heading{font-size:24px;font-weight:600;text-align:center;letter-spacing:-0.3px}
.subtitle{font-size:13.5px;color:var(--muted);text-align:center;margin-top:6px;margin-bottom:28px}
.form-group{position:relative;margin-bottom:20px}
.inp-line{position:relative;border:1px solid var(--border);border-radius:8px;padding:0 12px;transition:border-color 0.25s}
.inp-line:focus-within{border-color:var(--blue)}
.inp-line.error{border-color:var(--error)}
.fl-label{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;transition:all 0.2s;transform-origin:left center;background:var(--bg);padding:0 4px}
.form-inp{width:100%;border:none;outline:none;background:transparent;font-family:var(--font);font-size:14px;font-weight:400;color:var(--navy);padding:14px 28px 14px 0;line-height:1.4}
.form-inp:placeholder-shown~.fl-label{top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.form-inp:not(:placeholder-shown)~.fl-label,.form-inp:focus~.fl-label{top:0;transform:translateY(-50%) scale(0.85);color:var(--blue)}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--muted);transition:all 0.2s;display:flex;font-size:0;z-index:1}
.pw-toggle:hover{background:rgba(30,128,240,0.08);color:var(--blue)}
.pw-toggle .ti{font-size:19px}
.btn-pri{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px 20px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;transition:background 0.2s,box-shadow 0.2s,transform 0.2s}
.btn-pri:hover{background:var(--blue-hover);box-shadow:0 2px 8px rgba(30,128,240,0.25);transform:translateY(-1px)}
.btn-pri.loading{pointer-events:none;opacity:0.9}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.55s linear infinite;display:none}
.btn-pri.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.err-msg{font-size:12.5px;color:var(--error);text-align:center;margin-top:12px;display:none}
.err-msg.show{display:block}
.success-msg{font-size:12.5px;color:var(--success);text-align:center;margin-top:12px;display:none}
.success-msg.show{display:block}
.pw-reqs{display:flex;flex-direction:column;gap:3px;margin-top:6px;padding-left:2px}
.pw-req{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.pw-req .ti{font-size:13px}
.pw-req.met{color:#059669}
.pw-req.met .ti{color:#059669}
.invalid-token{display:none;text-align:center;padding:40px 20px}
.invalid-token.show{display:block}
.invalid-token .ti{font-size:40px;color:var(--error);display:block;margin-bottom:12px}
.invalid-token h2{font-size:18px;font-weight:600;margin-bottom:6px}
.invalid-token p{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="auth-wrap" id="app">
  <div class="logo-wrap"><img src="Fixtrack-removebg-preview.png" alt="Fixtrack"></div>

  <div id="resetForm">
    <h1 class="heading">Set new password</h1>
    <p class="subtitle">Enter your new password below.</p>
    <div class="form-group">
      <div class="inp-line" id="passLine">
        <input class="form-inp" type="password" id="newPass" placeholder=" " autocomplete="new-password">
        <label class="fl-label">New password</label>
        <button class="pw-toggle" id="passToggle" type="button"><i class="ti ti-eye"></i></button>
      </div>
    </div>
    <div class="pw-reqs" id="pwReqs">
      <span class="pw-req" data-req="length"><i class="ti ti-circle"></i> At least 8 characters</span>
      <span class="pw-req" data-req="upper"><i class="ti ti-circle"></i> One uppercase letter</span>
      <span class="pw-req" data-req="lower"><i class="ti ti-circle"></i> One lowercase letter</span>
      <span class="pw-req" data-req="number"><i class="ti ti-circle"></i> One number</span>
      <span class="pw-req" data-req="special"><i class="ti ti-circle"></i> One special character</span>
    </div>
    <div class="form-group">
      <div class="inp-line" id="confirmLine">
        <input class="form-inp" type="password" id="confirmPass" placeholder=" " autocomplete="new-password">
        <label class="fl-label">Confirm password</label>
        <button class="pw-toggle" id="confirmToggle" type="button"><i class="ti ti-eye"></i></button>
      </div>
    </div>
    <button class="btn-pri" id="submitBtn"><span class="spinner"></span><span id="btnLabel">Reset password</span></button>
    <div class="err-msg" id="errMsg"></div>
    <div class="success-msg" id="successMsg"></div>
  </div>

  <div class="invalid-token" id="invalidToken">
    <i class="ti ti-alert-triangle"></i>
    <h2>Invalid or expired link</h2>
    <p>This password reset link is invalid or has expired. <a href="http://localhost/fixtrack/index.html" style="color:var(--blue);text-decoration:none;font-weight:500">Request a new one.</a></p>
  </div>
</div>

<script>
(function(){
  const params=new URLSearchParams(window.location.search);
  const token=params.get('token');
  if(!token){document.getElementById('invalidToken').classList.add('show');document.getElementById('resetForm').style.display='none';return}

  const $=id=>document.getElementById(id);
  const newPass=$('newPass'),confirmPass=$('confirmPass');
  const passLine=$('passLine'),confirmLine=$('confirmLine');
  const submitBtn=$('submitBtn'),btnLabel=$('btnLabel'),errMsg=$('errMsg'),successMsg=$('successMsg');
  const pwReqs=$('pwReqs');

  function checkPw(v){
    const checks=[
      {key:'length',pass:v.length>=8},
      {key:'upper',pass:/[A-Z]/.test(v)},
      {key:'lower',pass:/[a-z]/.test(v)},
      {key:'number',pass:/[0-9]/.test(v)},
      {key:'special',pass:/[^A-Za-z0-9]/.test(v)},
    ];
    checks.forEach(c=>{
      const el=pwReqs.querySelector('[data-req="'+c.key+'"]');
      if(!el)return;
      el.classList.toggle('met',c.pass);
      el.querySelector('.ti').className='ti '+(c.pass?'ti-circle-check':'ti-circle');
    });
    return checks.every(c=>c.pass);
  }

  newPass.addEventListener('input',()=>checkPw(newPass.value));

  [document.getElementById('passToggle'),document.getElementById('confirmToggle')].forEach(btn=>{
    btn.addEventListener('click',()=>{
      const inp=btn.parentElement.querySelector('.form-inp');
      const t=inp.type==='password'?'text':'password';
      inp.type=t;
      btn.innerHTML=t==='text'?'<i class="ti ti-eye-off"></i>':'<i class="ti ti-eye"></i>';
    });
  });

  submitBtn.addEventListener('click',function(){
    const pass=newPass.value,confirm=confirmPass.value;
    errMsg.classList.remove('show');successMsg.classList.remove('show');
    passLine.classList.remove('error');confirmLine.classList.remove('error');

    if(!checkPw(pass)){passLine.classList.add('error');errMsg.textContent='Password does not meet requirements.';errMsg.classList.add('show');return}
    if(pass!==confirm){confirmLine.classList.add('error');errMsg.textContent='Passwords do not match.';errMsg.classList.add('show');return}

    submitBtn.classList.add('loading');
    btnLabel.textContent='Resetting\u2026';
    fetch('http://localhost/fixtrack/api/reset-password.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pass})})
    .then(r=>r.json()).then(d=>{
      submitBtn.classList.remove('loading');btnLabel.textContent='Reset password';
      if(d.success){
        successMsg.textContent='Password reset successfully! Redirecting to login\u2026';
        successMsg.classList.add('show');
        setTimeout(()=>window.location.href='http://localhost/fixtrack/index.html',2000);
      }else{
        errMsg.textContent=d.message;errMsg.classList.add('show');
      }
    }).catch(()=>{submitBtn.classList.remove('loading');btnLabel.textContent='Reset password';errMsg.textContent='Connection error.';errMsg.classList.add('show')});
  });

  document.addEventListener('keydown',e=>{if(e.key=='Enter')submitBtn.click()});
  gsap.from('.auth-wrap',{opacity:0,y:10,duration:0.4,ease:'power2.out'});
})();
</script>
</body>
</html>
